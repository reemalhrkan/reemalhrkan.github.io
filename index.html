<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Reem Al-Harkan | Architectural Portfolio</title>

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: #0b0b0b;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
    }

    /* HEADER */

    header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 28px 6%;
    }

    .logo img {
      width: 150px;
      height: auto;
      display: block;
    }

    .right-side {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    /* LINKEDIN */

    .linkedin {
      width: 42px;
      height: 42px;
      border: 1px solid #444;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      text-decoration: none;
      transition: 0.3s ease;
    }

    .linkedin:hover {
      background: #ffffff;
      color: #000000;
      transform: translateY(-3px);
    }

    .linkedin svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    .menu {
      font-size: 28px;
      cursor: pointer;
      padding-left: 5px;
    }


    /* HERO */

    .hero {
      min-height: 88vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 35px 7% 100px;
    }

    .hero-image {
      width: 100%;
      max-width: 1100px;
      height: 520px;
      object-fit: cover;
      border-radius: 18px;
      filter: brightness(0.78);
      transition: 0.5s ease;
    }

    .hero-image:hover {
      filter: brightness(0.92);
      transform: scale(1.005);
    }

    h1 {
      font-size: clamp(42px, 6vw, 82px);
      line-height: 0.95;
      margin-top: 48px;
      font-weight: 600;
      letter-spacing: -2px;
      text-align: center;
    }

    .subtitle {
      margin-top: 20px;
      color: #8e8e8e;
      font-size: clamp(14px, 1.5vw, 20px);
      letter-spacing: 3px;
      text-align: center;
      text-transform: uppercase;
    }


    /* PROJECTS */

    .projects {
      padding: 100px 7%;
      max-width: 1200px;
      margin: auto;
    }

    .section-title {
      color: #777777;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 5px;
      margin-bottom: 45px;
    }

    .project {
      border-top: 1px solid #2d2d2d;
      padding: 42px 5px;
      display: flex;
      align-items: center;
      gap: 35px;
      transition: 0.3s ease;
      cursor: pointer;
    }

    .project:last-child {
      border-bottom: 1px solid #2d2d2d;
    }

    .project:hover {
      padding-left: 20px;
    }

    .project-number {
      width: 45px;
      color: #666666;
      font-size: 13px;
      letter-spacing: 2px;
    }

    .project-info {
      flex: 1;
    }

    .project h2 {
      font-size: clamp(27px, 4vw, 50px);
      font-weight: 500;
      letter-spacing: -1px;
    }

    .project p {
      margin-top: 9px;
      color: #858585;
      font-size: 15px;
      letter-spacing: 0.5px;
    }

    .arrow {
      color: #777777;
      font-size: 27px;
      transition: 0.3s ease;
    }

    .project:hover .arrow {
      color: #ffffff;
      transform: translate(3px, -3px);
    }


    /* FOOTER */

    footer {
      margin-top: 80px;
      padding: 45px 7%;
      border-top: 1px solid #222222;
      display: flex;
      justify-content: space-between;
      gap: 20px;
      color: #666666;
      font-size: 12px;
      letter-spacing: 1px;
    }


    /* MOBILE */

    @media (max-width: 700px) {

      header {
        padding: 20px;
      }

      .logo img {
        width: 110px;
      }

      .linkedin {
        width: 38px;
        height: 38px;
      }

      .menu {
        font-size: 25px;
      }

      .hero {
        padding: 25px 20px 70px;
        min-height: auto;
      }

      .hero-image {
        height: 320px;
        border-radius: 14px;
      }

      h1 {
        margin-top: 35px;
        font-size: 46px;
        letter-spacing: -1px;
      }

      .subtitle {
        font-size: 12px;
        letter-spacing: 2px;
      }

      .projects {
        padding: 80px 22px;
      }

      .project {
        gap: 15px;
        padding: 30px 0;
      }

      .project-number {
        width: 30px;
      }

      .project h2 {
        font-size: 27px;
      }

      .project p {
        font-size: 13px;
      }

      footer {
        flex-direction: column;
      }
    }

  </style>
</head>


<body>

  <!-- HEADER -->

  <header>

    <div class="logo">
      <img src="logo.png" alt="Reem Al-Harkan Logo">
    </div>

    <div class="right-side">

      <!-- LINKEDIN ICON -->

      <a
        class="linkedin"
        href="https://www.linkedin.com/in/reem-al-harkan"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Reem Al-Harkan LinkedIn">

        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M20.45 20.45h-3.56v-5.57c0-1.33-.03-3.04-1.85-3.04-1.85 0-2.14 1.45-2.14 2.94v5.67H9.34V9h3.42v1.56h.05c.48-.9 1.64-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.46v6.28zM5.32 7.43a2.07 2.07 0 1 1 0-4.14 2.07 2.07 0 0 1 0 4.14zM7.1 20.45H3.54V9H7.1v11.45z"/>
        </svg>

      </a>

      <div class="menu">☰</div>

    </div>

  </header>


  <!-- MAIN HERO -->

  <section class="hero">

    <img
      class="hero-image"
      src="hero.jpg"
      alt="Architectural project by Reem Al-Harkan">

    <h1>REEM AL-HARKAN</h1>

    <div class="subtitle">
      Architectural Engineering Portfolio
    </div>

  </section>


  <!-- PROJECTS -->

  <section class="projects" id="projects">

    <div class="section-title">
      Selected Projects
    </div>


    <!-- PROJECT 01 -->

    <div class="project">

      <div class="project-number">
        01
      </div>

      <div class="project-info">
        <h2>CHILDREN'S LIBRARY</h2>
        <p>Sustainable Children's Library</p>
      </div>

      <div class="arrow">
        ↗
      </div>

    </div>


    <!-- PROJECT 02 -->

    <div class="project">

      <div class="project-number">
        02
      </div>

      <div class="project-info">
        <h2>LUJJAH</h2>
        <p>School of Marine Science & Research</p>
      </div>

      <div class="arrow">
        ↗
      </div>

    </div>


    <!-- PROJECT 03 -->

    <div class="project">

      <div class="project-number">
        03
      </div>

      <div class="project-info">
        <h2>NAFAS</h2>
        <p>Women's Health & Wellness Center</p>
      </div>

      <div class="arrow">
        ↗
      </div>

    </div>

  </section>


  <!-- FOOTER -->

  <footer>

    <div>
      © 2026 REEM AL-HARKAN
    </div>

    <div>
      ARCHITECTURAL ENGINEERING PORTFOLIO
    </div>

  </footer>

</body>
</html>
